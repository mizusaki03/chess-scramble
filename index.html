<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>キャプチャー スクランブル</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bs:min(96vw,520px,calc(100vh - 250px));--in:calc(var(--bs) - 12px);--cs:calc(var(--in)/8);--bg1:#f6f2ea;--bg2:#e2dccf;--fg:#2b2a28;--card:#ffffffcc;--lt:#f1dfbf;--dk:#b98d62;--me:#2f6bff;--cpu:#e5473f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#25242a;--bg2:#141318;--fg:#f1efe9;--card:#ffffff14}}
:root[data-theme="dark"]{--bg1:#25242a;--bg2:#141318;--fg:#f1efe9;--card:#ffffff14}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 50% 0,var(--bg1),var(--bg2));color:var(--fg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;flex-direction:column;align-items:center;padding:8px 0 10px;-webkit-user-select:none;user-select:none;overflow-x:hidden}
.hud{width:var(--bs);display:flex;gap:10px;margin-bottom:8px}
.pl{flex:1;background:var(--card);backdrop-filter:blur(8px);border-radius:14px;padding:6px 12px;border:2px solid transparent;transition:.25s;box-shadow:0 2px 8px #0002;display:flex;flex-direction:column}
.pl.me{--c:var(--me)}.pl.cpu{--c:var(--cpu)}
.pl.on{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent),0 4px 14px #0003;transform:translateY(-2px)}
.pl small{font-size:11px;opacity:.75;font-weight:600}
.pl b{font-size:28px;line-height:1.1;color:var(--c);font-variant-numeric:tabular-nums}
.pl b.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.5);filter:brightness(1.4)}100%{transform:scale(1)}}
.wrap{width:var(--bs);padding:6px;border-radius:18px;background:linear-gradient(145deg,#8a5a34,#5a3820);box-shadow:0 12px 28px #0006,inset 0 1px 2px #fff5;position:relative}
.wrap.sh1{animation:sh1 .3s}.wrap.sh2{animation:sh2 .4s}.wrap.sh3{animation:sh3 .55s}
@keyframes sh1{25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,0)}}
@keyframes sh2{20%{transform:translate(-7px,4px) rotate(-.4deg)}40%{transform:translate(7px,-4px) rotate(.4deg)}60%{transform:translate(-5px,3px)}80%{transform:translate(3px,-2px)}}
@keyframes sh3{15%{transform:translate(-11px,6px) rotate(-.8deg)}30%{transform:translate(11px,-6px) rotate(.8deg)}45%{transform:translate(-9px,5px)}60%{transform:translate(7px,-4px)}80%{transform:translate(-3px,2px)}}
#board,#fx{width:100%;aspect-ratio:1}
#board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));border-radius:10px;overflow:hidden}
#fx{position:absolute;left:6px;top:6px;width:var(--in);height:var(--in);pointer-events:none;z-index:5}
.c{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;cursor:pointer}
.c.l{background:linear-gradient(135deg,#f7e8cc,var(--lt))}.c.d{background:linear-gradient(135deg,#c79a6d,var(--dk))}
.c.last::before{content:"";position:absolute;inset:0;background:#ffe45a55}
.c.sel::before{content:"";position:absolute;inset:0;background:#46b0ff99}
.c.t::after{content:"";position:absolute;width:28%;height:28%;border-radius:50%;background:#12a05566;box-shadow:0 0 0 3px #12a05533}
.c.t.x::after{width:90%;height:90%;background:#e0302030;border:3px solid #e03020aa;box-shadow:none;animation:pl 1s infinite}
@keyframes pl{50%{transform:scale(.88)}}
.p{width:94%;height:94%;position:relative;z-index:2;transition:transform .15s;filter:drop-shadow(0 2px 2px #0006)}
.lgi{background:var(--img) center/contain no-repeat}
.p::after{content:"";position:absolute;inset:0;background:var(--img) center/contain no-repeat}
.pl .sr{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:4px}.top small{white-space:nowrap}
.tm{font-weight:800;opacity:0}.tm:not(:empty){opacity:.85}.tm.hot{color:#e5473f;opacity:1;animation:pl .8s infinite}
.p::before{content:"";position:absolute;left:14%;right:14%;bottom:2%;height:14%;border-radius:50%;background:var(--sc);filter:blur(2px);z-index:-1}
.p.m{--sc:#2f6bffcc}.p.o{--sc:#e5473fcc}
.lgi{display:inline-block;width:17px;height:21px;vertical-align:middle;margin-right:2px}
.c.sel .p{transform:translateY(-4px) scale(1.1)}
.p.mv{animation:slide .22s ease-out}
@keyframes slide{from{transform:translate(var(--dx),var(--dy))}}
.nw .p{animation:born .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes born{0%{transform:scale(0) rotate(-120deg)}100%{transform:scale(1)}}
.nwd .p{animation-delay:.55s}
.fc .sr{position:absolute;inset:6%;border-radius:50%;border:4px solid;opacity:0;animation:sring .75s ease-out forwards}
@keyframes sring{0%{transform:scale(.3);opacity:.95}100%{transform:scale(1.9);opacity:0}}
.fc .sg{position:absolute;inset:-25%;opacity:0;animation:sglow .8s ease-out forwards}
@keyframes sglow{0%{transform:scale(.4);opacity:0}30%{opacity:.9}100%{transform:scale(1.3);opacity:0}}
.fc{position:absolute;width:12.5%;height:12.5%;display:flex;align-items:center;justify-content:center}
.fc .p{position:absolute;width:84%;height:84%;animation:ghost .5s forwards}
@keyframes ghost{to{transform:scale(1.9) rotate(200deg);opacity:0;filter:brightness(2)}}
.fc .rg{position:absolute;inset:0;border-radius:50%;border:5px solid #fff;animation:ring2 .55s forwards}
@keyframes ring2{from{transform:scale(.3);opacity:1}to{transform:scale(2.6);opacity:0}}
.fc i{position:absolute;left:50%;top:50%;border-radius:50%;animation:burst .75s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.fc .ft{position:absolute;font-size:calc(var(--cs)*.75);font-weight:900;color:#ffd23a;-webkit-text-stroke:2px #5a3400;paint-order:stroke fill;text-shadow:0 3px 0 #5a3400;animation:rise 1.1s cubic-bezier(.2,.8,.3,1) forwards;white-space:nowrap}
.fc .lb{position:absolute;font-style:normal;font-size:calc(var(--cs)*.34);font-weight:800;color:#fff;background:linear-gradient(90deg,#ff7a18,#ff2e63);padding:2px 10px;border-radius:99px;white-space:nowrap;animation:rise2 1.2s forwards;box-shadow:0 2px 6px #0006}
@keyframes rise{0%{transform:translateY(0) scale(.2)}20%{transform:translateY(-14px) scale(1.5)}100%{transform:translateY(-70px) scale(1);opacity:0}}
@keyframes rise2{0%{transform:translateY(-8px) scale(.3);opacity:0}20%{transform:translateY(-34px) scale(1.15);opacity:1}80%{opacity:1}100%{transform:translateY(-62px);opacity:0}}
#msg{margin:10px 0 0;width:var(--bs);height:46px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:13px;line-height:1.3;font-weight:600;text-align:center;background:var(--card);padding:4px 14px;border-radius:14px}
.sub{font-size:12px;opacity:.7;text-align:center;width:var(--bs);line-height:1.6;margin-top:8px}
.lg{display:flex;justify-content:center;gap:10px;margin-top:4px;font-weight:700}
#snd{margin-top:8px;background:var(--card);color:var(--fg);font-size:14px;padding:6px 14px;border:0;border-radius:99px}
#ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:9}
#ov div{background:linear-gradient(160deg,#fff,#f2ead8);color:#222;padding:30px 36px;border-radius:22px;text-align:center;animation:born .6s}
#ov h2{margin:0 0 8px;font-size:30px}#ov p{margin:0;font-size:20px;font-weight:700}
#ov button{font-size:18px;font-weight:700;padding:12px 28px;border:0;border-radius:99px;background:linear-gradient(90deg,#3d7bff,#2358d6);color:#fff;margin-top:18px}
#st{position:fixed;inset:0;background:radial-gradient(circle at 50% 0,#ecc9a0 0,#d2a577 55%,#b88555 100%);display:none;align-items:center;justify-content:center;z-index:10;overflow:auto}
#st .box{background:linear-gradient(160deg,#fff,#f2ead8);color:#222;padding:26px 24px;border-radius:22px;text-align:center;width:min(92vw,380px);animation:born .5s}
#st h2{margin:0 0 6px;font-size:26px}#st h3{margin:18px 0 8px;font-size:14px;opacity:.7}
#st .row{display:flex;gap:8px}
#st .opt{flex:1;font-size:15px;font-weight:700;padding:12px 4px;border:2px solid #d8cdb6;border-radius:12px;background:#fff;color:#444}
#st .opt.on{border-color:#2f6bff;background:#2f6bff;color:#fff}
#st .go{width:100%;margin-top:24px;font-size:18px;font-weight:700;padding:13px;border:0;border-radius:99px;background:linear-gradient(90deg,#3d7bff,#2358d6);color:#fff}
#st .cx{margin-top:10px;background:none;border:0;color:#666;font-size:14px;display:none}
#gear{margin-top:8px;background:var(--card);color:var(--fg);font-size:14px;padding:6px 14px;border:0;border-radius:99px}
.bar{width:var(--bs);display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.bar .lg{margin:0;gap:12px;font-size:14px}
.bar button{margin:0 0 0 8px;width:40px;height:34px;padding:0;font-size:17px;background:var(--card);color:var(--fg);border:0;border-radius:99px}
#st .rule{font-size:12px;opacity:.65;line-height:1.6;margin:16px 0 0}
#st .opt{font-size:14px;white-space:nowrap;padding:12px 0}
#dif .opt{font-size:12.5px}
#st .box{padding:24px 18px}
@supports(height:100dvh){:root{--bs:min(96vw,520px,calc(100dvh - 250px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)))}}

#cd{position:absolute;left:6px;top:6px;width:var(--in);height:var(--in);display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:6;opacity:0;font-size:calc(var(--bs)*.15);font-weight:900;color:#fff;text-shadow:0 2px 14px #000a,0 0 3px #0006;letter-spacing:.04em}
#cd.show{animation:cdn 1.7s ease-out}
@keyframes cdn{0%{opacity:0;transform:scale(1.4)}14%{opacity:.5;transform:scale(1)}70%{opacity:.4}100%{opacity:0;transform:scale(.97)}}
.bar .ub{width:auto;height:40px;margin:0;padding:0 18px;font-size:15px;font-weight:800;white-space:nowrap;color:#fff;background:linear-gradient(90deg,#ff9a1f,#ff5a3c);box-shadow:0 3px 10px #ff5a3c66}
.bar .ub:disabled{opacity:.35;box-shadow:none}
.bar .ub:active:not(:disabled){transform:scale(.95)}
.bar>div{display:flex;flex-shrink:0}.bar #snd,.bar #gear{margin-top:0}.lg span{white-space:nowrap}
@media (max-width:400px){.bar .lg{gap:5px;font-size:12px}.lgi{width:13px;height:16px;margin-right:1px}.bar button{width:32px;margin-left:4px}.bar .ub{padding:0 13px;font-size:14px}}
#st .seg{margin-bottom:6px}
#code{flex:1;min-width:0;font-size:20px;font-weight:800;letter-spacing:.3em;text-align:center;text-transform:uppercase;padding:10px 4px;border:2px solid #d8cdb6;border-radius:12px;background:#fff;color:#222}
#st .go2{font-size:16px;font-weight:700;padding:0 18px;border:0;border-radius:12px;background:#2f6bff;color:#fff;margin:0}
#wcode{font-size:46px;font-weight:900;letter-spacing:.22em;color:#2f6bff;margin:4px 0 2px;padding-left:.22em}
#st .cx2{margin-top:8px;background:none;border:0;color:#666;font-size:14px}
#onmsg{min-height:20px;margin-top:10px}
@property --bg1{syntax:"<color>";inherits:true;initial-value:#f6f2ea}
@property --bg2{syntax:"<color>";inherits:true;initial-value:#e2dccf}
@property --fg{syntax:"<color>";inherits:true;initial-value:#2b2a28}
@property --card{syntax:"<color>";inherits:true;initial-value:#ffffffcc}
:root{transition:--bg1 2.4s ease,--bg2 2.4s ease,--fg 2.4s ease,--card 2.4s ease}
:root.blk{--bg1:#1d1d22;--bg2:#050507;--fg:#f1efe9;--card:#ffffff1c}
#tele{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:4;display:none;padding:9px 22px;border-radius:99px;background:#fffffff0;color:#222;font-size:14px;font-weight:800;letter-spacing:.06em;white-space:nowrap;pointer-events:none;box-shadow:0 4px 14px #0006;animation:blink 2.8s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.28}}
#intro{position:absolute;left:6px;top:6px;width:var(--in);height:var(--in);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;z-index:7;opacity:0;color:#fff;font-weight:900;line-height:1.3;text-shadow:0 2px 14px #000c,0 0 4px #0009;background:radial-gradient(circle,#0007,#0000 72%)}
#intro small{font-size:calc(var(--bs)*.075);letter-spacing:.1em}
#intro b{font-size:calc(var(--bs)*.135);letter-spacing:.04em}
#intro.show{animation:intr 3s ease-out}
@keyframes intr{0%{opacity:0;transform:scale(1.5)}12%{opacity:.92;transform:scale(1)}75%{opacity:.88}100%{opacity:0}}
.bar #snd,.bar #gear{width:36px;height:36px;padding:0;margin-top:0;display:inline-flex;align-items:center;justify-content:center;line-height:1;font-size:18px;border-radius:50%}
@media (max-width:400px){.bar #snd,.bar #gear{width:34px;height:34px}}
#st .box{margin:auto}
#st .go3{width:100%;font-size:16px;font-weight:700;padding:12px;border:2px solid #2f6bff;border-radius:99px;background:#fff;color:#2f6bff;margin:0}
.spin{display:inline-block;width:14px;height:14px;border:3px solid #2f6bff55;border-top-color:#2f6bff;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
#st::before{content:"";position:fixed;inset:0;opacity:.3;pointer-events:none;background:conic-gradient(#f7e8cc 25%,#c79a6d 0 50%,#f7e8cc 0 75%,#c79a6d 0) 0 0/72px 72px}
#st{padding:14px 0}
#st .box{position:relative;box-shadow:0 14px 36px #5a382066}

<script>
const V={Q:9,R:5,B:3,N:3,P:1},G={Q:"♛",R:"♜",B:"♝",N:"♞",P:"♟\uFE0E"};
const LB={Q:"クイーン撃破!!",R:"ルーク撃破!",B:"ビショップ撃破!",N:"ナイト撃破!",P:"ゲット!"};
let MAX=20,diff=1,gid=0,snaps=[];const DN=["イージー","ノーマル","ハード","プロ"];
let b,turn,mv,sc,sel,last,fresh,over,busy,tg,st,fxq,isNew,mute=false,AC;
let online=false,me="w",opp="k",flip=false,evFx=[],seqN=0,fbd=null,roomRef=null,roomCode="",R0=null,offMs=0,cid="",tickT=null,toSeq=-1,started=false,isHost=false,tickSec=0,inQueue=false,played=false;
const TURN_MS=30000,N=s=>"{"+s+"}",D=v=>flip?7-v:v;
const $=id=>document.getElementById(id),R=n=>Math.floor(Math.random()*n);
const nm={w:"あなた",k:"CPU"};
function setNames(){nm[me]="あなた";nm[opp]=online?"相手":"CPU";const sd=x=>x=="w"?"白":"黒";$("mn").textContent=`あなた(${sd(me)})`;$("cn").textContent=online?`相手(${sd(opp)})`:`CPU:${DN[diff]}(${sd(opp)})`}
function snd(f,d=.1,ty="sine",v=.12,t0=0){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function empties(){const e=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(!b[r][c])e.push([r,c]);return e}
// 初期配置の条件: クイーンは狙われない／お互い、狙われている駒は1つ以下
function initOK(){
 let q=0,ok=true;
 for(const s of["w","k"]){const hit=new Set();
  for(const m of allMoves(b,s=="w"?"k":"w")){const p=b[m[2]][m[3]];if(p){hit.add(m[2]*8+m[3]);if(p.t=="Q")q++}}
  if(hit.size>1)ok=false}
 return ok&&q==0;
}
function resetState(){
 gid++;snaps=[];turn="w";mv={w:0,k:0};sc={w:0,k:0};st={w:0,k:0};sel=null;last=[];fresh=[];fxq=[];evFx=[];isNew=false;over=false;busy=false;tg=[];seqN=0;
 for(let n=0;n<2000;n++){
  b=Array.from({length:8},()=>Array(8).fill(null));
  for(const s of["w","k"])for(const t of"QBBNN"){let r,c;do{r=(s=="w"?5:0)+R(3);c=R(8)}while(b[r][c]);b[r][c]={s,t}}
  if(initOK())break;
 }
}
function init(){
 leaveOnline();online=false;me="w";opp="k";flip=false;setNames();resetState();
 $("ov").style.display="none";$("undo").style.display="";say(`あなたの番です（${DN[diff]}・${MAX}手ずつ）`);draw();
}
function moves(bd,r,c){
 const p=bd[r][c],o=[];if(!p)return o;
 if(p.t=="P"){const y=r+(p.s=="w"?-1:1);if(y<0||y>7)return o;if(!bd[y][c])o.push([y,c]);for(const x of[c-1,c+1])if(x>=0&&x<8&&bd[y][x]&&bd[y][x].s!=p.s)o.push([y,x]);return o}
 if(p.t=="N"){for(const[a,d]of[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]]){const y=r+a,x=c+d;if(y<0||x<0||y>7||x>7)continue;if(!bd[y][x]||bd[y][x].s!=p.s)o.push([y,x])}return o}
 const D=[];if(p.t!="B")D.push([1,0],[-1,0],[0,1],[0,-1]);if(p.t!="R")D.push([1,1],[1,-1],[-1,1],[-1,-1]);
 for(const[a,d]of D){let y=r+a,x=c+d;while(y>=0&&x>=0&&y<8&&x<8){const q=bd[y][x];if(q){if(q.s!=p.s)o.push([y,x]);break}o.push([y,x]);y+=a;x+=d}}
 return o;
}
function allMoves(bd,s){const o=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(bd[r][c]&&bd[r][c].s==s)for(const t of moves(bd,r,c))o.push([r,c,t[0],t[1]]);return o}
// 出現位置が安全か: 1手で取られず、出現した駒も1手で敵を取れない
function okSpot(s,t,r,c){
 const e=s=="w"?"k":"w";b[r][c]={s,t};
 const bad=allMoves(b,e).some(m=>m[2]==r&&m[3]==c)||moves(b,r,c).some(([y,x])=>b[y][x]);
 b[r][c]=null;return !bad;
}
function risk(s,t,r,c){
 const e=s=="w"?"k":"w";b[r][c]={s,t};
 let am=null,av=1e9;for(const m of allMoves(b,e))if(m[2]==r&&m[3]==c){const v=V[b[m[0]][m[1]].t];if(v<av){av=v;am=m}}
 let k=0;
 if(am){const def=allMoves(sim(b,am),s).some(m=>m[2]==r&&m[3]==c);k=.2+Math.max(0,V[t]-(def?av:0))}
 if(moves(b,r,c).some(([y,x])=>b[y][x]))k+=.6;
 b[r][c]=null;return k;
}
// 出現: ①安全なマスを探す → ②別の駒種に引き直す → ③それも無理なら被害が最小のマスに置く
function spawn(s,t,fixed){
 const e=empties().sort(()=>Math.random()-.5);
 const spots=ty=>e.filter(([r])=>ty!="P"||(r>0&&r<7));
 const tryT=ty=>{const c=spots(ty).find(([r,c])=>okSpot(s,ty,r,c));return c?[ty,c]:null};
 let hit=tryT(t);
 if(!hit&&!fixed){
  const o=Object.keys(V).filter(x=>x!=t).sort((a,z)=>(V[a]<=V[t]?V[t]-V[a]:100+V[a]-V[t]+Math.random()*.5)-(V[z]<=V[t]?V[t]-V[z]:100+V[z]-V[t]+Math.random()*.5));
  for(const ty of o){hit=tryT(ty);if(hit)break}
 }
 if(!hit){let bs=1e9;for(const[r,c]of spots(t)){const k=risk(s,t,r,c)+Math.random()*.01;if(k<bs){bs=k;hit=[t,[r,c]]}}}
 if(!hit)return null;
 const[ty,[r,c]]=hit;b[r][c]={s,t:ty};fresh.push(r+","+c);return ty;
}
function randType(){const x=Math.random();return x<.28?"P":x<.52?"N":x<.74?"B":x<.9?"R":"Q"}
function hasQ(s){return b.some(row=>row.some(p=>p&&p.s==s&&p.t=="Q"))}
function apply(m,s){
 const[r,c,y,x]=m,cap=b[y][x],v=s=="w"?"k":"w";let t="";fresh=[];evFx=[];isNew=true;
 b[y][x]=b[r][c];b[r][c]=null;last=[[r,c],[y,x]];
 let pr=false;if(b[y][x].t=="P"&&(y==0||y==7)){b[y][x].t="Q";pr=true}
 if(cap){st[s]++;const val=V[cap.t];sc[s]+=val;t=`${N(s)}が${G[cap.t]}を取った +${val}`;const f={y,x,cap:cap.t,s,st:st[s],val};fxq.push(f);evFx.push(f)}
 else{st[s]=0;t=`${N(s)}が移動`}
 if(pr)t+="／ポーンがクイーンに昇格！";
 if(cap&&!hasQ(v)){spawn(v,"Q",true);t+=`（${N(v)}に新クイーン出現）`}
 return t;
}
function after(s,t){
 mv[s]++;
 if(mv[s]%3==0&&mv[s]<=MAX){const ty=spawn(s,randType());if(ty){t+=`／${N(s)}に${G[ty]}が出現！`;isNew=true}}
 say(t);next();
}
function next(){
 if(mv.w>=MAX&&mv.k>=MAX){draw();return finish()}
 turn=turn=="w"?"k":"w";
 if(mv[turn]>=MAX)turn=turn=="w"?"k":"w";
 if(!allMoves(b,turn).length){draw();const s=turn,g=gid;setTimeout(()=>{if(g!=gid)return;fresh=[];last=[];after(s,`${N(s)}は動かせずパス`)},600);return}
 draw();
 if(turn=="k"){busy=true;const g=gid;setTimeout(()=>{if(g==gid)cpu()},800)}else{busy=false;countdown()}
 updUndo();
}
function cpu(){
 let best=null,bs=-1e9;
 if(diff==1&&Math.random()<.3){const ms=allMoves(b,"k");return after("k",apply(ms[R(ms.length)],"k"))}
 for(const m of allMoves(b,"k")){
  const cap=b[m[2]][m[3]],g=cap?V[cap.t]:0;
  const nb=b.map(r=>r.slice());nb[m[2]][m[3]]=nb[m[0]][m[1]];nb[m[0]][m[1]]=null;
  let thr=0;for(const o of allMoves(nb,"w")){const q=nb[o[2]][o[3]];if(q&&q.s=="k")thr=Math.max(thr,V[q.t])}
  const pro=b[m[0]][m[1]].t=="P"&&m[2]==7?6:0;
  const s=diff==0?(Math.random()<.25?Math.random()*20:g+Math.random()*4-thr*.15):diff==1?g*1.1+pro*.5+Math.random()*1.5-thr*.7:diff==2?g*1.1+pro-thr+Math.random()*.6:evalHard(m,nb,g,pro);
  if(s>bs){bs=s;best=m}
 }
 after("k",apply(best,"k"));
}
function bestGain(bd,s){let m=0;for(const o of allMoves(bd,s)){const q=bd[o[2]][o[3]];if(q)m=Math.max(m,V[q.t])}return m}
function sim(bd,m){const n=bd.map(r=>r.slice());n[m[2]][m[3]]=n[m[0]][m[1]];n[m[0]][m[1]]=null;return n}
function evalHard(m,nb,g,pro){
 const rep=allMoves(nb,"w");let worst=rep.length?1e9:bestGain(nb,"k")*.6;
 for(const o of rep){const q=nb[o[2]][o[3]],og=q?V[q.t]:0;worst=Math.min(worst,-og+.6*bestGain(sim(nb,o),"k"))}
 return g*1.1+pro+worst+Math.random()*.1;
}
function tap(r,c){
 if(over||busy||turn!=me)return;
 const p=b[r][c];snd(500,.04,"triangle",.05);
 if(sel&&tg.some(t=>t[0]==r&&t[1]==c)){const m=[sel[0],sel[1],r,c];sel=null;tg=[];
  if(online){afterOnline(me,apply(m,me));return}
  snaps.push({b:b.map(x=>x.map(p=>p&&{...p})),mv:{...mv},sc:{...sc},st:{...st}});busy=true;after("w",apply(m,"w"));return}
 if(p&&p.s==me){if(sel&&sel[0]==r&&sel[1]==c){sel=null;tg=[]}else{sel=[r,c];tg=moves(b,r,c)}}else{sel=null;tg=[]}

}
function updUndo(){
 const u=$("undo");u.textContent="↩ 待った";
 u.disabled=!(turn=="w"&&!busy&&!over&&snaps.length>0);
}
function undo(){
 if(over||busy||turn!="w"||!snaps.length)return;
 const o=snaps.pop();b=o.b;mv=o.mv;sc=o.sc;st=o.st;
 gid++;turn="w";sel=null;tg=[];last=[];fresh=[];fxq=[];isNew=false;busy=false;

}
function countdown(){
 const r=MAX-mv[me];if(over||turn!=me||r>3||r<1)return;
 const e=$("cd");e.textContent=r==1?"ラスト1手":`残り${r}手`;
 e.classList.remove("show");void e.offsetWidth;e.classList.add("show");
}
function say(t){$("msg").textContent=t.replace(/\{(w|k)\}/g,(_,x)=>nm[x])}
function draw(){
 const useNew=isNew,dl=fxq.length>0,fl=flip?-1:1;isNew=false;let h="";
 const fr=useNew?fresh.map(k=>{const[y,x]=k.split(",").map(Number);return{y,x,s:b[y][x]&&b[y][x].s}}):[];
 for(let dr=0;dr<8;dr++)for(let dc=0;dc<8;dc++){
  const r=flip?7-dr:dr,c=flip?7-dc:dc;
  const p=b[r][c],isT=tg.some(t=>t[0]==r&&t[1]==c);
  const isLast=last.some(l=>l[0]==r&&l[1]==c);
  const cl=["c",(r+c)%2?"d":"l",isT?"t":"",isT&&p?"x":"",sel&&sel[0]==r&&sel[1]==c?"sel":"",isLast?"last":"",useNew&&fresh.includes(r+","+c)?(dl?"nw nwd":"nw"):""].join(" ");
  let pc="";
  if(p){const mvd=useNew&&last[1]&&last[1][0]==r&&last[1][1]==c;
   const sty=mvd?` style="--dx:calc(var(--cs)*${(last[0][1]-c)*fl});--dy:calc(var(--cs)*${(last[0][0]-r)*fl})"`:"";
   pc=`<div class="p ${p.s} ${p.s==me?"m":"o"} t${p.t}${mvd?" mv":""}"${sty}></div>`}
  h+=`<div class="c ${cl}" onclick="tap(${r},${c})">${pc}</div>`;
 }
 $("board").innerHTML=h;
 $("sw").textContent=sc[me];$("sk").textContent=sc[opp];
 $("rw").textContent=MAX-mv[me];$("rk").textContent=MAX-mv[opp];
 $("pw").classList.toggle("on",turn==me&&!over);$("pk").classList.toggle("on",turn==opp&&!over);updUndo();
 $("tele").style.display=online&&turn==opp&&!over?"block":"none";
 if(useNew){
  const q=fxq.splice(0);
  if(q.length)setTimeout(()=>q.forEach(fx),170);else snd(300,.07,"triangle",.08);
  if(fr.length)setTimeout(()=>{fr.forEach(spawnFx);snd(880,.15,"sine",.1);snd(1320,.2,"sine",.08,.08);vib(15)},q.length?560:0);
 }
}
function spawnFx(o){
 if(!o.s)return;const c=o.s==me?"#4f8aff":"#ff5a50",d=document.createElement("div");d.className="fc";d.style.left=D(o.x)*12.5+"%";d.style.top=D(o.y)*12.5+"%";
 let h=`<div class="sg" style="background:radial-gradient(circle,${c}cc,${c}00 70%)"></div><div class="sr" style="border-color:${c}"></div><div class="sr" style="border-color:${c};animation-delay:.15s"></div>`;
 for(let i=0;i<6;i++){const a=i*1.047+.5;h+=`<i style="--dx:${Math.cos(a)*38}px;--dy:${Math.sin(a)*38}px;width:7px;height:7px;margin:-3.5px;background:#fff;box-shadow:0 0 6px ${c}"></i>`}
 d.innerHTML=h;$("fx").appendChild(d);setTimeout(()=>d.remove(),1000);
}
function fx(q){
 const L=$("fx"),d=document.createElement("div");d.className="fc";d.style.left=D(q.x)*12.5+"%";d.style.top=D(q.y)*12.5+"%";
 const big=q.val>=9||q.st>=3,mid=q.val>=5||q.st>=2,n=8+q.val*3+q.st*4;
 const col=q.s==me?["#6fa0ff","#9cc2ff","#fff"]:["#ff7a70","#ffaaa0","#fff"];col.push("#ffd23a","#ffd23a");
 let h=`<div class="rg" style="border-color:${col[0]}"></div><div class="p ${q.s=="w"?"k":"w"} t${q.cap}"></div>`;
 for(let i=0;i<n;i++){const a=Math.random()*6.283,dist=(big?70:45)+Math.random()*(big?90:55),sz=4+Math.random()*(big?9:6);
  h+=`<i style="--dx:${Math.cos(a)*dist}px;--dy:${Math.sin(a)*dist}px;width:${sz}px;height:${sz}px;margin:${-sz/2}px;background:${col[R(col.length)]}"></i>`}
 h+=`<span class="ft">+${q.val}</span>`;
 h+=`<em class="lb">${q.st>=2?`COMBO ×${q.st}　`:""}${LB[q.cap]}</em>`;
 d.innerHTML=h;L.appendChild(d);setTimeout(()=>d.remove(),1300);
 const w=$("wrap");w.className="wrap";void w.offsetWidth;w.className="wrap sh"+(big?3:mid?2:1);
 const e=$(q.s==me?"sw":"sk");e.classList.remove("bump");void e.offsetWidth;e.classList.add("bump");
 const f=1+.12*(q.st-1),notes=q.cap=="Q"?[523,659,784,1047,1319]:q.cap=="R"?[523,659,784,1047]:q.cap=="P"?[660,880]:[523,784,1047];
 notes.forEach((n,i)=>snd(n*f,.18,"triangle",.14,i*.055));snd(110,.25,"sawtooth",big?.14:.07);
 vib(big?[30,30,70]:mid?[25,20,35]:20);
}
function finish(res){
 over=true;played=true;
 const who=online?"相手":"CPU";let t;
 if(res&&res.left)t="🎉 相手が退出しました。あなたの勝ち";
 else if(res)t=res.loser==me?"⏰ 時間切れで負け…":"🎉 相手が時間切れ！あなたの勝ち";
 else{const d=sc[me]-sc[opp];t=d>0?"🎉 あなたの勝ち！":d<0?`😵 ${who}の勝ち…`:"🤝 引き分け"}
 $("rt").textContent=t;$("rs").textContent=`あなた ${sc[me]} - ${sc[opp]} ${who}`;
 const o1=$("ov1"),o2=$("ov2");
 if(online){o1.textContent="メニューへ";o1.onclick=()=>{leaveOnline();$("ov").style.display="none";openSet()};o2.style.display="none"}
 else{o1.textContent="もう一度";o1.onclick=init;o2.style.display=""}
 const g=gid;setTimeout(()=>{if(g==gid){$("ov").style.display="flex";draw()}},res?300:1100);
 if(online&&isHost)setTimeout(()=>{if(online&&isHost&&roomRef){const r=roomRef;detach();r.remove().catch(()=>{})}},12000);
}

const FBCFG={apiKey:"AIzaSyBGbSJStvgh1fCU_muValry3AmkAArCe0U",authDomain:"chess-scramble-15f0d.firebaseapp.com",databaseURL:"https://chess-scramble-15f0d-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"chess-scramble-15f0d",storageBucket:"chess-scramble-15f0d.firebasestorage.app",messagingSenderId:"850166544391",appId:"1:850166544391:web:85a82d97695784c21312a2"};
const FBV="10.14.1",CH="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const sNow=()=>Date.now()+offMs;
function onMsg(t,err){const e=$("onmsg");e.textContent=t;e.style.color=err?"#c0392b":""}
function loadFB(){
 if(window.firebase&&firebase.database)return Promise.resolve();
 const ld=u=>new Promise((ok,ng)=>{const x=document.createElement("script");x.src=u;x.onload=ok;x.onerror=()=>ng(new Error("load"));document.head.appendChild(x)});
 return ld(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app-compat.js`).then(()=>ld(`https://www.gstatic.com/firebasejs/${FBV}/firebase-database-compat.js`));
}
async function fbInit(){
 if(fbd)return;
 await loadFB();
 if(!firebase.apps.length)firebase.initializeApp(FBCFG);
 fbd=firebase.database();
 fbd.ref(".info/serverTimeOffset").on("value",x=>offMs=x.val()||0);
 try{cid=sessionStorage.getItem("cid")||"";if(!cid){cid=Math.random().toString(36).slice(2,10);sessionStorage.setItem("cid",cid)}}catch(e){cid=Math.random().toString(36).slice(2,10)}
}
async function prep(){
 onMsg("接続中…");
 try{await fbInit();return true}catch(e){onMsg("Firebaseの読み込みに失敗しました。ネットワークや公開場所（GitHub Pagesなど）を確認してください",1);return false}
}
function pack(t,fin){
 return{seq:seqN,turn,b:b.flat().map(p=>p?p.s+p.t:"--").join(","),mw:mv.w,mk:mv.k,sw:sc.w,sk:sc.k,tw:st.w,tk:st.k,
  last:last.length?last[0].concat(last[1]).join(","):"",fresh:fresh.join(";"),fx:JSON.stringify(evFx),msg:t,fin:!!fin,deadline:fin?0:sNow()+TURN_MS};
}
function unpack(S){
 const c=S.b.split(",");
 b=Array.from({length:8},(_,r)=>Array.from({length:8},(_,k)=>{const v=c[r*8+k];return v=="--"?null:{s:v[0],t:v[1]}}));
 mv={w:S.mw,k:S.mk};sc={w:S.sw,k:S.sk};st={w:S.tw,k:S.tk};turn=S.turn;
 const L=S.last?S.last.split(",").map(Number):[];last=L.length==4?[[L[0],L[1]],[L[2],L[3]]]:[];
 fresh=S.fresh?S.fresh.split(";"):[];fxq=JSON.parse(S.fx||"[]");
}
function withTimeout(start,ms=10000){return new Promise(res=>{const to=setTimeout(()=>res({to:1}),ms);start((e,c,snap)=>{clearTimeout(to);res({e,c,v:snap&&snap.val()})})})}
const errTxt=r=>r.to?"接続できません。databaseURL（Firebaseの設定）やネットワークを確認してください":("接続エラー: "+(r.e.code||r.e.message||r.e));
async function makeRoom(){
 resetState();me="w";opp="k";online=false;seqN=0;
 const S0=pack("対戦開始！ 先手（白）から始まります",false);
 for(let n=0;n<8;n++){
  const code=Array.from({length:4},()=>CH[R(CH.length)]).join("");
  const room={host:cid,status:"waiting",created:firebase.database.ServerValue.TIMESTAMP,state:S0};
  const r=await withTimeout(cb=>fbd.ref("rooms/"+code).transaction(cur=>cur===null?room:undefined,cb,false));
  if(r.to||r.e){onMsg(errTxt(r),1);return null}
  if(r.c)return code;
 }
 onMsg("部屋を作れませんでした。もう一度試してください",1);return null;
}
function showWait(code){
 $("onctl").style.display="none";$("wait").style.display="";
 $("wcode").style.display=code?"":"none";$("wcode").textContent=code||"";
 $("wh").textContent=code?"部屋コード":"ランダムマッチ";
 $("wtx").innerHTML=code?"このコードを相手に伝えてください。<br>入室を待っています…":'<span class="spin"></span>対戦相手を探しています…<br>見つかると自動で始まります。';
 onMsg("");
}
async function createRoom(){
 if(!await prep())return;
 const code=await makeRoom();if(!code)return;
 roomCode=code;isHost=true;attach(code);showWait(code);
}
// ランダムマッチ: 待機所 /waiting に1人だけ並べ、2人目がトランザクションで取り出す（二重マッチなし）
async function randomMatch(){
 if(!await prep())return;
 for(let n=0;n<4;n++){
  const code=await makeRoom();if(!code)return;
  let took=null;
  const mine={cid,code,ts:firebase.database.ServerValue.TIMESTAMP};
  const r=await withTimeout(cb=>fbd.ref("waiting").transaction(cur=>{
   took=null;
   if(cur&&cur.cid!==cid&&!(typeof cur.ts==="number"&&sNow()-cur.ts>120000)){took=cur;return null}
   return mine;
  },cb,false));
  if(r.to||r.e){fbd.ref("rooms/"+code).remove().catch(()=>{});return onMsg(errTxt(r),1)}
  if(took){
   fbd.ref("rooms/"+code).remove().catch(()=>{});
   const ok=await doJoin(took.code);
   if(ok===null)return;
   if(ok){roomCode=took.code;isHost=false;attach(took.code);onMsg("対戦相手が見つかりました。開始します…");return}
   continue;
  }
  roomCode=code;isHost=true;inQueue=true;
  fbd.ref("waiting").onDisconnect().remove();fbd.ref("rooms/"+code).onDisconnect().remove();
  attach(code);showWait(null);return;
 }
 onMsg("マッチングに失敗しました。もう一度試してください",1);
}
async function doJoin(code){
 const r=await withTimeout(cb=>fbd.ref("rooms/"+code).transaction(room=>{
  if(room===null)return room;
  if(room.guest||room.status!=="waiting")return;
  room.guest=cid;room.status="playing";room.white=Math.random()<.5?room.host:cid;room.state.deadline=sNow()+TURN_MS+3000;return room},cb,false));
 if(r.to||r.e){onMsg(errTxt(r),1);return null}
 return !!(r.c&&r.v&&r.v.guest===cid);
}
async function joinRoom(){
 const code=$("code").value.trim().toUpperCase();
 if(code.length!=4)return onMsg("4文字のコードを入力してください",1);
 if(!await prep())return;
 const ok=await doJoin(code);
 if(ok===null)return;
 if(!ok)return onMsg("部屋が見つからないか、すでに満員です",1);
 roomCode=code;isHost=false;attach(code);onMsg("入室しました。開始します…");
}
function attach(code){
 detach();started=false;toSeq=-1;
 roomRef=fbd.ref("rooms/"+code);roomRef.on("value",onRoom);
 tickT=setInterval(tick,250);
}
function detach(){if(roomRef){roomRef.off();roomRef=null}clearInterval(tickT);tickT=null}
function cancelWait(){leaveOnline();onMsg("");init()}
function leaveOnline(){
 if(inQueue&&fbd){fbd.ref("waiting").transaction(cur=>cur&&cur.cid===cid?null:undefined,()=>{},false);fbd.ref("waiting").onDisconnect().cancel();if(roomCode)fbd.ref("rooms/"+roomCode).onDisconnect().cancel();inQueue=false}
 if(roomRef){const r=roomRef,host=isHost;detach();if(host)r.remove().catch(()=>{})}
 document.documentElement.classList.remove("blk");onMsg("");
 online=false;started=false;isHost=false;roomCode="";R0=null;
 $("onctl").style.display="";$("wait").style.display="none";
 $("tmw").textContent=$("tmk").textContent="";
}
function onRoom(snap){
 const room=snap.val();
 if(!room){if(started&&!over)finish({loser:opp,left:1});return}
 if(room.status!=="playing"||!room.state)return;
 const S=room.state;
 if(!started){started=true;startOnline((room.white||room.host)===cid?"w":"k",S);if(S.result)finish(S.result);return}
 if(S.result){R0=S;if(!over)finish(S.result);return}
 if(S.seq>seqN)applyRemote(S);
}
function startOnline(side,S){
 played=true;online=true;me=side;opp=side=="w"?"k":"w";flip=side=="k";MAX=20;setNames();
 gid++;snaps=[];sel=null;tg=[];last=[];over=false;busy=false;
 unpack(S);seqN=S.seq;R0=S;isNew=false;
 if(inQueue&&fbd){fbd.ref("waiting").onDisconnect().cancel();fbd.ref("rooms/"+roomCode).onDisconnect().cancel();inQueue=false}
 $("st").style.display="none";$("ov").style.display="none";$("undo").style.display="none";onMsg("");
 say(S.msg);draw();startMyTurn();
 document.documentElement.classList.toggle("blk",me=="k");intro();
}
function intro(){
 const e=$("intro");e.innerHTML=`<small>あなたは</small><b>${me=="w"?"先手・白":"後手・黒"}です</b>`;
 e.classList.remove("show");void e.offsetWidth;e.classList.add("show");
 snd(me=="w"?660:330,.25,"triangle",.1);snd(me=="w"?990:495,.35,"triangle",.1,.14);
}
function applyRemote(S){
 unpack(S);seqN=S.seq;R0=S;isNew=true;sel=null;tg=[];say(S.msg);draw();
 if(S.fin)finish();else startMyTurn();
}
function startMyTurn(){
 if(turn!==me||over)return;
 if(!allMoves(b,me).length){const g=gid,q=seqN;setTimeout(()=>{if(g!=gid||q!=seqN||over)return;fresh=[];last=[];evFx=[];afterOnline(me,`${N(me)}は動かせずパス`)},700);return}
 countdown();
}
function afterOnline(s,t){
 mv[s]++;
 if(mv[s]%3==0&&mv[s]<=MAX){const ty=spawn(s,randType());if(ty){t+=`／${N(s)}に${G[ty]}が出現！`;isNew=true}}
 const fin=mv.w>=MAX&&mv.k>=MAX;
 let nt=s=="w"?"k":"w";if(mv[nt]>=MAX)nt=s;
 turn=nt;seqN++;const S=pack(t,fin);R0=S;
 pushState(S);say(t);draw();
 if(fin)finish();
}
function pushState(S){
 if(!roomRef)return;
 roomRef.child("state").transaction(cur=>{if(cur===null)return cur;if(cur.seq!==S.seq-1||cur.result)return;return S},
  (e,c)=>{if(!c&&roomRef)roomRef.once("value").then(onRoom)},false);
}
function tick(){
 if(!online||!R0)return;
 const mt=$("tmw"),ot=$("tmk");mt.textContent=ot.textContent="";mt.className=ot.className="tm";
 if(over||R0.fin||R0.result||!R0.deadline)return;
 const rem=R0.deadline-sNow(),sec=Math.max(0,Math.ceil(rem/1000)),e=turn===me?mt:ot;
 e.textContent="⏱ "+sec;if(sec<=10)e.classList.add("hot");
 if(turn===me&&sec<=5&&sec>0&&tickSec!==sec){tickSec=sec;snd(900,.08,"square",.06);vib(10)}
 if(rem<-700&&toSeq!==seqN){toSeq=seqN;declareTimeout()}
}
function declareTimeout(){
 const q=seqN;if(!roomRef)return;
 roomRef.child("state").transaction(cur=>{if(cur===null)return cur;if(cur.seq!==q||cur.result||cur.fin)return;cur.result={loser:cur.turn,at:sNow()};return cur},()=>{},false);
}
function toggleHelp(){const h=$("help");h.style.display=h.style.display=="none"?"block":"none"}
(function(){let seen=false;try{seen=localStorage.getItem("cs_seen")==="1";if(!seen)localStorage.setItem("cs_seen","1")}catch(e){}$("help").style.display=seen?"none":"block"})();

 $("cpuset").style.display=i?"none":"";$("onset").style.display=i?"":"none";
}
document.querySelectorAll("#dif .opt,#len .opt").forEach(x=>x.onclick=()=>{x.parentNode.querySelectorAll(".opt").forEach(y=>y.classList.remove("on"));x.classList.add("on")});
