<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>キャプチャー スクランブル</title>
<meta name="theme-color" content="#1d1c23">
<link rel="icon" href="https://mizusaki03.github.io/chess-scramble/favicon.ico">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bs:min(96vw,520px,calc(100vh - 250px));--in:calc(var(--bs) - 12px);--cs:calc(var(--in)/8);color-scheme:dark;--bg1:#2a2931;--bg2:#121116;--fg:#f1efe9;--card:#ffffff14;--btn:#3b3a46;--lt:#f1dfbf;--dk:#b98d62;--me:#4d88ff;--cpu:#ff6358}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 50% 0,var(--bg1),var(--bg2));color:var(--fg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;flex-direction:column;align-items:center;padding:8px 0 10px;-webkit-user-select:none;user-select:none;overflow-x:hidden}
.hud{width:var(--bs);display:flex;gap:10px;margin-bottom:8px}
.pl{flex:1;background:var(--card);backdrop-filter:blur(8px);border-radius:14px;padding:6px 12px;border:2px solid transparent;transition:.25s;box-shadow:0 2px 8px #0002;display:flex;flex-direction:column}
.pl.me{--c:var(--me)}.pl.cpu{--c:var(--cpu)}
.pl.on{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent),0 4px 14px #0003;transform:translateY(-2px)}
.pl small{font-size:11px;opacity:.75;font-weight:600}
.pl b{font-size:28px;line-height:1.1;color:var(--c);font-variant-numeric:tabular-nums}
.pl b.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.5);filter:brightness(1.4)}100%{transform:scale(1)}}
.wrap{width:var(--bs);padding:6px;border-radius:18px;background:linear-gradient(145deg,#8a5a34,#5a3820);box-shadow:0 12px 28px #0006,inset 0 1px 2px #fff5;position:relative}
.wrap.sh1{animation:sh1 .3s}.wrap.sh2{animation:sh2 .4s}.wrap.sh3{animation:sh3 .55s}
@keyframes sh1{25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,0)}}
@keyframes sh2{20%{transform:translate(-7px,4px) rotate(-.4deg)}40%{transform:translate(7px,-4px) rotate(.4deg)}60%{transform:translate(-5px,3px)}80%{transform:translate(3px,-2px)}}
@keyframes sh3{15%{transform:translate(-11px,6px) rotate(-.8deg)}30%{transform:translate(11px,-6px) rotate(.8deg)}45%{transform:translate(-9px,5px)}60%{transform:translate(7px,-4px)}80%{transform:translate(-3px,2px)}}
#board,#fx{width:100%;aspect-ratio:1}
#board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));border-radius:10px;overflow:hidden}
#fx{position:absolute;left:6px;top:6px;width:var(--in);height:var(--in);pointer-events:none;z-index:5}
.c{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;cursor:pointer}
.c.l{background:linear-gradient(135deg,#ecd9b4,#e3cda3)}.c.d{background:linear-gradient(135deg,#c79a6d,var(--dk))}
.c.last::before{content:"";position:absolute;inset:0;background:#ffe45a55}
.c.sel::before{content:"";position:absolute;inset:0;background:#46b0ff99}
.c.t::after{content:"";position:absolute;width:28%;height:28%;border-radius:50%;background:#12a05566;box-shadow:0 0 0 3px #12a05533}
.c.t.x::after{width:90%;height:90%;background:#e0302030;border:3px solid #e03020aa;box-shadow:none;animation:pl 1s infinite}
@keyframes pl{50%{transform:scale(.88)}}
.p{width:94%;height:94%;position:relative;z-index:2;transition:transform .15s;filter:drop-shadow(0 2px 2px #0006)}
.lgi{background:var(--img) center/contain no-repeat}
.p::after{content:"";position:absolute;inset:0;background:var(--img) center/contain no-repeat}
.pl .sr{position:relative;display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:4px}.top small{white-space:nowrap}
.tm{font-weight:800;opacity:0}.tm:not(:empty){opacity:.85}.tm.hot{color:#e5473f;opacity:1;animation:pl .8s infinite}
.p::before{content:"";position:absolute;left:14%;right:14%;bottom:2%;height:14%;border-radius:50%;background:var(--sc);filter:blur(2px);z-index:-1}
.p.m{--sc:#2f6bffcc}.p.o{--sc:#e5473fcc}
.lgi{display:inline-block;width:17px;height:21px;vertical-align:middle;margin-right:2px}
.c.sel .p{transform:translateY(-4px) scale(1.1)}
.p.mv{animation:slide .22s ease-out}
@keyframes slide{from{transform:translate(var(--dx),var(--dy))}}
.nw .p{animation:born .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes born{0%{transform:scale(0) rotate(-120deg)}100%{transform:scale(1)}}
.nwd .p{animation-delay:.55s}
.fc .sr{position:absolute;inset:6%;border-radius:50%;border:4px solid;opacity:0;animation:sring .75s ease-out forwards}
@keyframes sring{0%{transform:scale(.3);opacity:.95}100%{transform:scale(1.9);opacity:0}}
.fc .sg{position:absolute;inset:-25%;opacity:0;animation:sglow .8s ease-out forwards}
@keyframes sglow{0%{transform:scale(.4);opacity:0}30%{opacity:.9}100%{transform:scale(1.3);opacity:0}}
.fc{position:absolute;width:12.5%;height:12.5%;display:flex;align-items:center;justify-content:center}
.fc .p{position:absolute;width:84%;height:84%;animation:ghost .5s forwards}
@keyframes ghost{to{transform:scale(1.9) rotate(200deg);opacity:0;filter:brightness(2)}}
.fc .rg{position:absolute;inset:0;border-radius:50%;border:5px solid #fff;animation:ring2 .55s forwards}
@keyframes ring2{from{transform:scale(.3);opacity:1}to{transform:scale(2.6);opacity:0}}
.fc i{position:absolute;left:50%;top:50%;border-radius:50%;animation:burst .75s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.fc .ft{position:absolute;font-size:calc(var(--cs)*.75);font-weight:900;color:#ffd23a;-webkit-text-stroke:2px #5a3400;paint-order:stroke fill;text-shadow:0 3px 0 #5a3400;animation:rise 1.1s cubic-bezier(.2,.8,.3,1) forwards;white-space:nowrap}
.fc .lb{position:absolute;font-style:normal;font-size:calc(var(--cs)*.34);font-weight:800;color:#fff;background:linear-gradient(90deg,#ff7a18,#ff2e63);padding:2px 10px;border-radius:99px;white-space:nowrap;animation:rise2 1.2s forwards;box-shadow:0 2px 6px #0006}
@keyframes rise{0%{transform:translateY(0) scale(.2)}20%{transform:translateY(-14px) scale(1.5)}100%{transform:translateY(-70px) scale(1);opacity:0}}
@keyframes rise2{0%{transform:translateY(-8px) scale(.3);opacity:0}20%{transform:translateY(-34px) scale(1.15);opacity:1}80%{opacity:1}100%{transform:translateY(-62px);opacity:0}}
#msg{margin:10px 0 0;width:var(--bs);height:46px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:13px;line-height:1.3;font-weight:600;text-align:center;background:var(--card);padding:4px 14px;border-radius:14px}
.sub{font-size:12px;opacity:.7;text-align:center;width:var(--bs);line-height:1.6;margin-top:8px}
.lg{display:flex;justify-content:center;gap:10px;margin-top:4px;font-weight:700}
#snd{margin-top:8px;background:var(--card);color:var(--fg);font-size:14px;padding:6px 14px;border:0;border-radius:99px}
#ov{position:fixed;inset:0;overflow:auto;padding:14px 0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}
#ov button{font-size:18px;font-weight:700;padding:12px 28px;border:0;border-radius:99px;background:linear-gradient(90deg,#3d7bff,#2358d6);color:#fff;margin-top:18px}
#st{position:fixed;inset:0;background:radial-gradient(circle at 50% 0,#34323d 0,#1f1e26 55%,#0e0d12 100%);display:none;align-items:center;justify-content:center;z-index:10;overflow:auto}
#st .box{background:linear-gradient(160deg,#fff,#f2ead8);color:#222;padding:26px 24px;border-radius:22px;text-align:center;width:min(92vw,380px);animation:born .5s}
#st h2{margin:0 0 6px;font-size:26px}#st h3{margin:18px 0 8px;font-size:14px;opacity:.7}
#st .row{display:flex;gap:8px}
#st .opt{flex:1;font-size:15px;font-weight:700;padding:12px 4px;border:2px solid #d8cdb6;border-radius:12px;background:#fff;color:#444}
#st .opt.on{border-color:#2f6bff;background:#2f6bff;color:#fff}
#st .go{width:100%;margin-top:24px;font-size:18px;font-weight:700;padding:13px;border:0;border-radius:99px;background:linear-gradient(90deg,#3d7bff,#2358d6);color:#fff}
#st .cx{margin-top:12px;padding:9px 26px;background:#e9dfcc;border:0;border-radius:99px;color:#5a3820;font-size:14px;font-weight:800;display:none}
#gear{margin-top:8px;background:var(--card);color:var(--fg);font-size:14px;padding:6px 14px;border:0;border-radius:99px}
.bar{width:var(--bs);display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.bar .lg{margin:0;gap:12px;font-size:14px}
.bar button{margin:0 0 0 8px;width:40px;height:34px;padding:0;font-size:17px;background:var(--btn);color:var(--fg);border:0;border-radius:99px}
#st .rule{font-size:12px;opacity:.65;line-height:1.6;margin:16px 0 0}
#st .opt{font-size:14px;white-space:nowrap;padding:12px 0}
#dif .opt{font-size:12.5px}
#st .box{padding:24px 18px}
@supports(height:100dvh){:root{--bs:min(96vw,520px,calc(100dvh - 250px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)))}}

#cd{position:absolute;left:6px;top:6px;width:var(--in);height:var(--in);display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:6;opacity:0;font-size:calc(var(--bs)*.15);font-weight:900;color:#fff;text-shadow:0 2px 14px #000a,0 0 3px #0006;letter-spacing:.04em}
#cd.show{animation:cdn 1.7s ease-out}
@keyframes cdn{0%{opacity:0;transform:scale(1.4)}14%{opacity:.5;transform:scale(1)}70%{opacity:.4}100%{opacity:0;transform:scale(.97)}}
.bar .ub{width:auto;height:40px;margin:0;padding:0 18px;font-size:15px;font-weight:800;white-space:nowrap;color:#fff;background:linear-gradient(90deg,#ff9a1f,#ff5a3c);box-shadow:0 3px 10px #ff5a3c66}
.bar .ub:disabled{opacity:.35;box-shadow:none}
.bar .ub:active:not(:disabled){transform:scale(.95)}
.bar>div{display:flex;flex-shrink:0}.bar #snd,.bar #gear{margin-top:0}.lg span{white-space:nowrap}
@media (max-width:400px){.bar .lg{gap:5px;font-size:12px}.lgi{width:13px;height:16px;margin-right:1px}.bar button{width:32px;margin-left:4px}.bar .ub{padding:0 13px;font-size:14px}}
#st .seg{margin-bottom:6px}
#code{flex:1;min-width:0;font-size:20px;font-weight:800;letter-spacing:.3em;text-align:center;text-transform:uppercase;padding:10px 4px;border:2px solid #d8cdb6;border-radius:12px;background:#fff;color:#222}
#st .go2{font-size:16px;font-weight:700;padding:0 18px;border:0;border-radius:12px;background:#2f6bff;color:#fff;margin:0}
#wcode{font-size:46px;font-weight:900;letter-spacing:.22em;color:#2f6bff;margin:4px 0 2px;padding-left:.22em}
#st .cx2{margin-top:10px;padding:9px 26px;background:#e9dfcc;border:0;border-radius:99px;color:#5a3820;font-size:14px;font-weight:800}
#onmsg{min-height:20px;margin-top:10px}
#tele{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:4;display:none;padding:9px 22px;border-radius:99px;background:#fffffff0;color:#222;font-size:14px;font-weight:800;letter-spacing:.06em;white-space:nowrap;pointer-events:none;box-shadow:0 4px 14px #0006;animation:blink 2.8s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.28}}
#intro{position:absolute;left:6px;top:6px;width:var(--in);height:var(--in);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;z-index:7;opacity:0;color:#fff;font-weight:900;line-height:1.3;text-shadow:0 2px 14px #000c,0 0 4px #0009;background:radial-gradient(circle,#0007,#0000 72%)}
#intro small{font-size:calc(var(--bs)*.075);letter-spacing:.1em}
#intro b{font-size:calc(var(--bs)*.135);letter-spacing:.04em}
#intro.show{animation:intr 3s ease-out}
@keyframes intr{0%{opacity:0;transform:scale(1.5)}12%{opacity:.92;transform:scale(1)}75%{opacity:.88}100%{opacity:0}}
.bar #snd,.bar #gear{width:36px;height:36px;padding:0;margin-top:0;display:inline-flex;align-items:center;justify-content:center;line-height:1;font-size:18px;border-radius:50%}
@media (max-width:400px){.bar #snd,.bar #gear{width:34px;height:34px}}
#st .box{margin:auto}
#st .go3{width:100%;font-size:16px;font-weight:700;padding:12px;border:2px solid #2f6bff;border-radius:99px;background:#fff;color:#2f6bff;margin:0}
.spin{display:inline-block;width:14px;height:14px;border:3px solid #2f6bff55;border-top-color:#2f6bff;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
#st::before{content:"";position:fixed;inset:-72px;animation:tile 15s linear infinite;opacity:.08;pointer-events:none;background:conic-gradient(#f7e8cc 25%,#c79a6d 0 50%,#f7e8cc 0 75%,#c79a6d 0) 0 0/72px 72px}
#st{padding:14px 0}
#st .box{position:relative;box-shadow:0 14px 36px #5a382066}
#cpuset>.go{position:sticky;bottom:6px;box-shadow:0 8px 18px #0006}
.hero{position:relative;margin:-24px -18px 12px;padding:16px 12px 16px;text-align:center;color:#fff;background:linear-gradient(145deg,#8a5a34,#5a3820);border-radius:22px 22px 26px 26px;box-shadow:0 4px 0 #3a2210,inset 0 1px 2px #fff5}
.pcs{display:flex;justify-content:center;align-items:flex-end;gap:4px;height:62px}

function initOK(){

function freshBoard(){

function freshState(nb,rd){

function initGame(){

function moves(bd,r,c){
 const p=bd[r][c],o=[];if(!p)return o;
 if(p.t=="P"){const y=r+(p.s=="w"?-1:1);if(y<0||y>7)return o;if(!bd[y][c])o.push([y,c]);for(const x of[c-1,c+1])if(x>=0&&x<8&&bd[y][x]&&bd[y][x].s!=p.s)o.push([y,x]);return o}
 if(p.t=="N"){for(const[a,d]of[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]]){const y=r+a,x=c+d;if(y<0||x<0||y>7||x>7)continue;if(!bd[y][x]||bd[y][x].s!=p.s)o.push([y,x])}return o}

 for(const[a,d]of D){let y=r+a,x=c+d;while(y>=0&&x>=0&&y<8&&x<8){const q=bd[y][x];if(q){if(q.s!=p.s)o.push([y,x]);break}o.push([y,x]);y+=a;x+=d}}

}
function allMoves(bd,s){const o=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(bd[r][c]&&bd[r][c].s==s)for(const t of moves(bd,r,c))o.push([r,c,t[0],t[1]]);return o}

function okSpot(s,t,r,c){

 const bad=allMoves(b,e).some(m=>m[2]==r&&m[3]==c)||moves(b,r,c).some(([y,x])=>b[y][x]);
 b[r][c]=null;return !bad;
}
function risk(s,t,r,c){
 const e=s=="w"?"k":"w";b[r][c]={s,t};
 let am=null,av=1e9;for(const m of allMoves(b,e))if(m[2]==r&&m[3]==c){const v=V[b[m[0]][m[1]].t];if(v<av){av=v;am=m}}
 let k=0;
 if(am){const def=allMoves(sim(b,am),s).some(m=>m[2]==r&&m[3]==c);k=.2+Math.max(0,V[t]-(def?av:0))}

 b[r][c]=null;return k;
}
// 出現: ①安全なマスを探す → ②別の駒種に引き直す → ③それも無理なら被害が最小のマスに置く
function spawn(s,t,fixed){

 let hit=tryT(t);
 if(!hit&&!fixed){
  const o=Object.keys(V).filter(x=>x!=t).sort((a,z)=>(V[a]<=V[t]?V[t]-V[a]:100+V[a]-V[t]+Math.random()*.5)-(V[z]<=V[t]?V[t]-V[z]:100+V[z]-V[t]+Math.random()*.5));
  for(const ty of o){hit=tryT(ty);if(hit)break}
 }
 if(!hit){let bs=1e9;for(const[r,c]of spots(t)){const k=risk(s,t,r,c)+Math.random()*.01;if(k<bs){bs=k;hit=[t,[r,c]]}}}
 if(!hit)return null;

// 9点差で±10%、15点差以上で±20%（相対）。負けている側は、クイーンとルークが出やすく、ポーンは出にくくなる
function randType(s){
 const dif=s?(sc[s=="w"?"k":"w"]-sc[s]):0;
 const bo=dif>=15?.2:dif>=9?.1+.1*(dif-9)/6:0;
 const P=.28*(1-bo),R=.16*(1+bo),Q=.1*(1+bo),k=(1-P-R-Q)/.46;
 const W=[["P",P],["N",.24*k],["B",.22*k],["R",R],["Q",Q]];
 let x=Math.random();for(const[t,w]of W){x-=w;if(x<0)return t}return"Q";
}
function randType(s){
 const dif=s?(sc[s=="w"?"k":"w"]-sc[s]):0;
 const bo=dif>=15?.2:dif>=9?.1+.1*(dif-9)/6:0;
 const P=.28*(1+bo),Q=.1*(1+bo),k=(1-P-Q)/.62;
 const W=[["P",P],["N",.24*k],["B",.22*k],["R",.16*k],["Q",Q]];
 let x=Math.random();for(const[t,w]of W){x-=w;if(x<0)return t}return"Q";
}
function hasQ(s){return b.some(row=>row.some(p=>p&&p.s==s&&p.t=="Q"))}
function apply(m,s){

 let pr=false;if(b[y][x].t=="P"&&(y==0||y==7)){b[y][x].t="Q";pr=true}
 if(cap){st[s]++;const val=V[cap.t];sc[s]+=val;t=`${N(s)}が${NM[cap.t]}を取った +${val}`;const f={y,x,cap:cap.t,s,st:st[s],val};fxq.push(f);evFx.push(f)}

}
function after(s,t){

function next(){

 if(!allMoves(b,turn).length){draw();const s=turn,g=gid;setTimeout(()=>{if(g!=gid)return;fresh=[];last=[];after(s,`${N(s)}は動かせずパス`)},600);return}

function cpu(){
 let best=null,bs=-1e9;
 if(diff==1&&Math.random()<.3){const ms=allMoves(b,"k");return after("k",apply(ms[R(ms.length)],"k"))}
 for(const m of allMoves(b,"k")){
  const cap=b[m[2]][m[3]],g=cap?V[cap.t]:0;
  const nb=b.map(r=>r.slice());nb[m[2]][m[3]]=nb[m[0]][m[1]];nb[m[0]][m[1]]=null;
  let thr=0;for(const o of allMoves(nb,"w")){const q=nb[o[2]][o[3]];if(q&&q.s=="k")thr=Math.max(thr,V[q.t])}
  const pro=b[m[0]][m[1]].t=="P"&&m[2]==7?6:0;
  const s=diff==0?(Math.random()<.25?Math.random()*20:g+Math.random()*4-thr*.15):diff==1?g*1.1+pro*.5+Math.random()*1.5-thr*.7:diff==2?g*1.1+pro-thr+Math.random()*.6:evalHard(m,nb,g,pro);

function bestGain(bd,s){let m=0;for(const o of allMoves(bd,s)){const q=bd[o[2]][o[3]];if(q)m=Math.max(m,V[q.t])}return m}

function tap(r,c){

 const p=b[r][c];snd(500,.04,"triangle",.05);

  if(peek&&peek[0]==r&&peek[1]==c){peek=null;pkt=[]}else{peek=[r,c];pkt=moves(b,r,c)}}

function updUndo(){

 const useNew=isNew,dl=fxq.length>0,fl=flip?-1:1;isNew=false;let h="";
 const fr=useNew?fresh.map(k=>{const[y,x]=k.split(",").map(Number);return{y,x,s:b[y][x]&&b[y][x].s}}):[];

  const isLast=last.some(l=>l[0]==r&&l[1]==c);
  const cl=["c",(r+c)%2?"d":"l",isT?"t":"",isT&&p?"x":"",isP?"pt":"",isP&&p?"px":"",peek&&peek[0]==r&&peek[1]==c?"pks":"",sel&&sel[0]==r&&sel[1]==c?"sel":"",isLast?"last":"",useNew&&fresh.includes(r+","+c)?(dl?"nw nwd":"nw"):""].join(" ");

  if(p){const mvd=useNew&&last[1]&&last[1][0]==r&&last[1][1]==c;
   const sty=mvd?` style="--dx:calc(var(--cs)*${(last[0][1]-c)*fl});--dy:calc(var(--cs)*${(last[0][0]-r)*fl})"`:"";
   pc=`<div class="p ${p.s} ${p.s==me?"m":"o"} t${p.t}${mvd?" mv":""}"${sty}></div>`}

 }
 $("board").innerHTML=h;
 {const bd=$("board");bd.classList.toggle("myturn",turn==me&&!over);bd.style.setProperty("--ph",((performance.now()/1000)%1.8).toFixed(3))}
 $("sw").textContent=sc[me];$("sk").textContent=sc[opp];

}

 {const sb=$(q.s==me?"sw":"sk"),g=document.createElement("i");   // 「+点数」は上の点数表示のそばに出す

function finish(res){

 initGame();
 const st=$("st");st.classList.remove("compact");$("cx").style.display="none";onMsg("");setMode(0);
 st.style.display="flex";
}
function setMode(i){
 document.querySelectorAll("#mode .opt").forEach((x,j)=>x.classList.toggle("on",j==i));
 $("cpuset").style.display=i?"none":"";$("onset").style.display=i?"":"none";
}
document.querySelectorAll("#dif .opt,#len .opt").forEach(x=>x.onclick=()=>{x.parentNode.querySelectorAll(".opt").forEach(y=>y.classList.remove("on"));x.classList.add("on")});
function start(){played=true;diff=+document.querySelector("#dif .on").dataset.v;MAX=+document.querySelector("#len .on").dataset.v;curtain(()=>{leaveOnline();$("st").style.display="none";initGame()})}
function openSet(){if(!inQueue)onMsg("");$("st").classList.toggle("compact",played);if(played)$("help").style.display="none";$("cx").style.display="inline-block";$("st").style.display="flex"}
$("rvl").onclick=()=>rvStep(-1);$("rvr").onclick=()=>rvStep(1);$("rvf").onclick=()=>rvJump(0);$("rve").onclick=()=>rvJump(hist.length-1);
$("rv1").onclick=()=>$("ov1").click();$("rv2").onclick=()=>$("ov2").click();$("rv3").onclick=()=>{$("ov").style.display="flex"};
document.addEventListener("keydown",e=>{if(!rvOn)return;if(e.key==="ArrowLeft")rvStep(-1);else if(e.key==="ArrowRight")rvStep(1);else if(e.key==="Home")rvJump(0);else if(e.key==="End")rvJump(hist.length-1)});
{const mo=new MutationObserver(syncRv),cfg={attributes:true,childList:true,characterData:true,subtree:true};mo.observe($("ov1"),cfg);mo.observe($("ov2"),cfg);mo.observe($("rm"),cfg)}
initGame();$("st").style.display="flex";
</script></body></html>
